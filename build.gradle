/**
 * Thaumaturge Kami — NeoForge build script
 * Targets Minecraft 26.1.2 / NeoForge 26.1.2.76 (Java 25) via ModDevGradle.
 */
plugins {
    id 'java'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

// ---------------------------------------------------------------------------
// Helpers (ported from the RFG build)
// ---------------------------------------------------------------------------
ext {
    assertProperty = { String name ->
        if (!project.hasProperty(name) || property(name).toString().isEmpty()) {
            throw new GradleException("Property '$name' is required but not defined!")
        }
    }
    propertyString = { String name ->
        assertProperty.call(name)
        return project.property(name).toString()
    }
    propertyBool = { String name, boolean defaultValue = null ->
        if (name == null) return false
        if (!project.hasProperty(name)) {
            if (defaultValue != null) return defaultValue
            throw new GradleException("Property '$name' is not defined!")
        }
        return Boolean.parseBoolean(project.property(name).toString())
    }
    propertyStringList = { String name, String delimiter = ' ' ->
        return propertyString(name).split(delimiter).toList()
    }
    interpolate = { String value ->
        def result = value
        project.properties.each { k, v ->
            result = result.replace("\${$k}", v?.toString() ?: '')
        }
        return result
    }
}

// Early Assertions
assertProperty 'mod_version'
assertProperty 'root_package'
assertProperty 'mod_id'
assertProperty 'mod_name'
assertProperty 'minecraft_version'
assertProperty 'neoforge_version'

version = propertyString('mod_version')
group = propertyString('root_package')

base {
    archivesName.set(propertyString('mod_id'))
}

repositories {
    // Thaumaturge (Thaumcraft port for Minecraft 26.1)
    maven {
        name = 'Leclown Maven'
        url = 'https://maven.leclowndu93150.dev/releases'
    }
    // Thaumaturge's published POM pulls its dev runtime mods transitively (runtime scope):
    // Curios (a real runtime dependency) plus JEI/Jade/Sodium/one Modrinth mod for the dev client.
    // Each lives in a different repository, so all three have to be declared for runClient to resolve.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'IllusiveC4 (Curios)'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    mavenCentral()
    mavenLocal()
}

dependencies {
    // The only prerequisite: Thaumaturge replaces Thaumcraft + Thaumic API
    implementation "com.leclowndu93150:thaumaturge-${propertyString('minecraft_version')}-neoforge:${propertyString('thaumaturge_version')}"

    compileOnly 'org.jetbrains:annotations:24.1.0'

    if (propertyBool('enable_junit_testing')) {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(propertyString('java_toolchain_version')))
    }
    if (propertyBool('generate_sources_jar')) {
        withSourcesJar()
    }
}

sourceSets {
    main {
        java {
            srcDir 'build/generated/java'
        }
    }
}

// ---------------------------------------------------------------------------
// ModDevGradle / NeoForge
// ---------------------------------------------------------------------------
neoForge {
    version = propertyString('neoforge_version')

    // Access Transformers
    if (propertyBool('use_access_transformer')) {
        accessTransformers.from(file("src/main/resources/META-INF/${propertyString('access_transformer_locations')}"))
    }
    validateAccessTransformers = true

    // Publishing: access transformers are stripped from the published jar? No,
    // they are kept at META-INF/<mod_id>_at.cfg as usual.

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', propertyString('mod_id')
            programArgument '--username'
            programArgument propertyString('minecraft_username')
            jvmArgument '-ea:' + propertyString('root_package')
        }
        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', propertyString('mod_id')
            programArgument '--nogui'
            jvmArgument '-ea:' + propertyString('root_package')
        }
    }

    mods {
        "${propertyString('mod_id')}" {
            sourceSet sourceSets.main
        }
    }
}

// ---------------------------------------------------------------------------
// Tags (build-time generated constants)
// ---------------------------------------------------------------------------
def tagsTask = tasks.register('generateTags', Task) {
    group = 'build'
    description = 'Generates the Tags class from tags.properties'
    def outputDir = layout.buildDirectory.dir('generated/java')
    outputs.dir(outputDir)
    if (propertyBool('use_tags') && file('tags.properties').exists()) {
        inputs.file file('tags.properties')
        doLast {
            Properties props = new Properties().tap { it.load(file('tags.properties').newInputStream()) }
            def entries = props.collectEntries { k, v -> [(k.toString()): interpolate(v.toString())] }
            def fqcn = interpolate(propertyString('tag_class_name'))
            def pkg = fqcn.substring(0, fqcn.lastIndexOf('.'))
            def cls = fqcn.substring(fqcn.lastIndexOf('.') + 1)
            def outFile = outputDir.get().file("${pkg.replace('.', '/')}/${cls}.java").asFile
            outFile.parentFile.mkdirs()
            outFile.text = "package ${pkg};\n\n" +
                    "// Generated at build time from tags.properties, do not edit.\n" +
                    "public final class ${cls} {\n" +
                    entries.collect { k, v -> "    public static final String ${k} = \"${v}\";" }.join('\n') + "\n" +
                    "    private ${cls}() {}\n" +
                    "}\n"
        }
    }
}

compileJava.dependsOn tasks.named('generateTags')
//generateTags writes into build/generated/java, which is a main source dir, so anything else
//consuming the main sources (the sources jar) has to wait for it too.
tasks.named('sourcesJar') {
    dependsOn tasks.named('generateTags')
}

test {
    useJUnitPlatform()
    if (propertyBool('show_testing_output')) {
        testLogging {
            showStandardStreams = true
        }
    }
}

processResources {
    // Files whose ${...} placeholders are substituted from gradle.properties
    def filterList = ['pack.mcmeta', 'META-INF/neoforge.mods.toml']
    filesMatching(filterList) { fcd ->
        fcd.expand(
                'mod_id': propertyString('mod_id'),
                'mod_name': propertyString('mod_name'),
                'mod_version': propertyString('mod_version'),
                'mod_description': propertyString('mod_description'),
                'mod_authors': "${propertyStringList('mod_authors', ',').join(', ')}",
                'mod_credits': propertyString('mod_credits'),
                'mod_url': propertyString('mod_url'),
                'mod_logo_path': propertyString('mod_logo_path'),
                'minecraft_version': propertyString('minecraft_version'),
                'neoforge_version': propertyString('neoforge_version'),
                'minecraft_version_range': propertyString('minecraft_version_range'),
                'neoforge_version_range': propertyString('neoforge_version_range')
        )
    }
}

jar {
    manifest {
        attributes([
                'Implementation-Title': propertyString('mod_name'),
                'Implementation-Version': propertyString('mod_version'),
                'Implementation-Vendor': propertyString('mod_authors')
        ])
    }
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}
