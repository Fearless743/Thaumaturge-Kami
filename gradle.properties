# Gradle Properties
org.gradle.jvmargs = -Xmx3G
org.gradle.parallel = true
org.gradle.caching = true

# Source Options
# Minecraft 26.1 / NeoForge 26.1 require Java 25
java_toolchain_version = 25

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = true
show_testing_output = false

# Mod Information
# HIGHLY RECOMMEND complying with SemVer for mod_version: https://semver.org/
mod_version = 1.1.0
root_package = mod.emt
mod_id = kami
mod_name = Thaumaturge Kami

# Mod Metadata (Optional)
mod_description = Port and rewrite of Thaumic Tinkerer's KAMI content for Thaumaturge.
mod_url = https://github.com/Fearless743/Thaumaturge-Kami
mod_update_json =
# Delimit authors with commas
mod_authors = Fearless743
mod_credits = Based on KamiReborn by IcarussOne and Invadermonky (Elite Modding Team). pixlepix, Vazkii, and others for their work on the original mod. Fakeginkgo for his Fake Thaummy Pack resource pack.
mod_logo_path = logo.png

# Toolchain Properties
minecraft_version = 26.1.2
neoforge_version = 26.1.2.76
# Version ranges declared in neoforge.mods.toml
minecraft_version_range = [26.1.2,27.1)
neoforge_version_range = [26,)

# Prerequisite mods
# Thaumaturge (Thaumcraft port for Minecraft 26.1, by Leclowndu93150)
# https://github.com/Leclowndu93150/Thaumaturge
thaumaturge_version = 1.0.0

# Run Configurations
# If multiple arguments/tweak classes are stated, use spaces as the delimiter
minecraft_username = Developer
extra_jvm_args =

# Maven Publishing (Provide secret: MAVEN_USER, MAVEN_PASS)
publish_to_maven = false
# Good for debugging artifacts before uploading to remote maven
maven_name = ${mod_name}
maven_url =

# Publishing
# release_type can only be: release, beta or alpha (applies to CurseForge / Modrinth)
release_type = release

# Publishing to CurseForge (Provide secrets: CURSEFORGE_TOKEN, CF_PROJECT_ID)
# The Deploy workflow (.github/workflows/deploy.yml) uploads via mc-publish and
# reads the numeric project ID from the CF_PROJECT_ID repository secret.
# Keep false until (1) redistribution permission from the Elite Modding Team is
# granted and (2) this fork has its own CurseForge project ID.
publish_to_curseforge = false
# CurseForge project ID must be the numerical ID and not the slug
curseforge_project_id =
curseforge_debug = false

# Publishing to Modrinth (Provide secret: MODRINTH_TOKEN)
publish_to_modrinth = false
modrinth_project_id =
modrinth_debug = false

# Tags
# A class is generated at build-time for compilation, to describe properties that have values that could change at build time such as versioning
use_tags = true
tag_class_name = ${root_package}.${mod_id}.Tags

# Access Transformers
# A way to change visibility of Minecraft's classes, methods and fields
use_access_transformer = true
access_transformer_locations = kami_at.cfg
